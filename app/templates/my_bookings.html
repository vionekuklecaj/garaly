{% extends "base.html" %}
{% block title %}{{ t.myBookingsTitle }} – Garaly{% endblock %}
{% block content %}
<main>
  <div class="container" style="padding-top:24px;padding-bottom:64px;">
    <h1 class="page-title hfont">{{ t.myBookingsTitle }}</h1>
    <p style="color:var(--ink-muted);margin:-12px 0 32px;">{{ t.myBookingsSub }}</p>

    {% if not user %}
      <div class="empty-state"><p>{{ t.loginToList }}</p></div>
    {% else %}
      <div id="bookings-box"><p style="color:var(--ink-muted);">…</p></div>
    {% endif %}
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>
const LANG = "{{ lang }}";
const T = {
  noBookingsYet: {{ t.noBookingsYet|tojson }},
  findASpace: {{ t.findASpace|tojson }},
  statusPending: {{ t.statusPending|tojson }},
  statusAccepted: {{ t.statusAccepted|tojson }},
  statusDeclined: {{ t.statusDeclined|tojson }},
};

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function statusLabel(status) {
  if (status === "accepted") return T.statusAccepted;
  if (status === "declined") return T.statusDeclined;
  return T.statusPending;
}

async function loadBookings() {
  const box = document.getElementById("bookings-box");
  if (!box) return;
  const res = await fetch("/api/bookings/me");
  if (!res.ok) { box.innerHTML = ""; return; }
  const bookings = await res.json();

  if (!bookings.length) {
    box.innerHTML = `<div class="empty-state" style="padding:32px 0;">
      <p>${T.noBookingsYet}</p>
      <button class="btn-primary" style="margin-top:12px;" onclick="location.href='/search?lang=${LANG}'">${T.findASpace}</button>
    </div>`;
    return;
  }

  box.innerHTML = bookings.map(b => `
    <a class="dash-listing-row" href="/listing/${b.space_id}?lang=${LANG}" style="display:flex;">
      <div class="thumb"></div>
      <div class="info">
        <div class="title">${escapeHtml(b.space_title)} · ${escapeHtml(b.space_city)}</div>
        <div class="meta">${b.move_in_date} → ${b.move_out_date}</div>
      </div>
      <span class="status-badge ${b.status}">${statusLabel(b.status)}</span>
    </a>
  `).join("");
}

loadBookings();
</script>
{% endblock %}
